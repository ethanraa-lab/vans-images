<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team sign in · Vans Image Workbench</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f4f1;color:#202120;font:15px Arial,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px}main{width:100%;max-width:420px;background:white;border:1px solid #deded7;border-radius:14px;padding:36px}.brand{font-size:12px;font-weight:bold;letter-spacing:2px;color:#a12323}h1{margin-top:24px;font-size:28px}p{color:#73766e;line-height:1.6}label{display:block;margin:20px 0 7px;font-size:13px;font-weight:bold}input,button{width:100%;padding:13px;border-radius:7px;border:1px solid #ccd0c7;font:inherit}button{margin-top:25px;background:#c82929;color:white;border:0;cursor:pointer}button:disabled{opacity:.6}#error{color:#a12323;font-size:13px;min-height:20px}</style></head><body><main><div class="brand">VANS / IMAGE WORKBENCH</div><h1>Team sign in</h1><p>Use your shared team account to access the product image workspace.</p><form id="login"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required maxlength="128"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="512"><button id="submit">Sign in</button><p id="error" role="alert"></p></form><p style="font-size:12px">Access is managed by the site owner. Public registration is unavailable.</p></main><script>document.querySelector('#login').onsubmit=async e=>{e.preventDefault();const b=document.querySelector('#submit'),error=document.querySelector('#error');b.disabled=true;error.textContent='';try{const response=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.querySelector('#username').value,password:document.querySelector('#password').value})});const data=await response.json();document.querySelector('#password').value='';if(!response.ok)throw Error(data.error||'Sign in failed.');location.replace('/')}catch(e){error.textContent=e.message||'Could not connect. Try again.'}finally{b.disabled=false}};</script></body></html>
